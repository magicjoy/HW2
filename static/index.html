<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Timetable Planner</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>주간 공부 일정 플래너</h1><p class="muted">이미지는 외부로 전송하거나 저장하지 않습니다.</p><section class="card"><h2>1. 시간표 이미지 분석</h2><input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp"><button id="recognize">인식 시작</button><p id="msg" class="muted"></p></section><section class="card"><h2>2. 인식 결과 확인</h2><div id="classes"></div><button id="add">수업 추가</button></section><section class="card"><h2>3. 공부 목표</h2><p class="muted">중요도는 1~5, 공부 시간은 주간 분 단위입니다.</p><div id="subjects"></div><button id="recommend">추천 일정 생성</button></section><section class="card"><h2>4. 추천 주간 캘린더</h2><div id="calendar"></div><div id="summary"></div></section></main><script src="/static/app.js"></script></body></html>
