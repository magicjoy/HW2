name: CI and Docker Hub

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on self-hosted Windows runner
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:${{ github.sha }}
      CONTAINER_NAME: local-timetable-planner
      PREVIOUS_CONTAINER: local-timetable-planner-previous
      HOST_PORT: '8000'
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull image and verify it before replacement
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          [Console]::OutputEncoding = $OutputEncoding
          function Test-ServiceEndpoint([string]$Uri) {
            try {
              $request = [System.Net.WebRequest]::Create($Uri)
              $request.Timeout = 3000
              $response = $request.GetResponse()
              $status = [int]$response.StatusCode
              $response.Close()
              Write-Host "Health endpoint $Uri returned HTTP $status"
              return ($status -ge 200 -and $status -lt 400)
            } catch {
              Write-Host "Health endpoint $Uri error: $($_.Exception.Message)"
              return $false
            }
          }
          docker pull "$env:IMAGE"
          $previousId = docker container ls -aq --filter "name=^$env:PREVIOUS_CONTAINER`$"
          if (-not [string]::IsNullOrWhiteSpace(($previousId -join ''))) {
            Write-Host "Removing stale temporary container $env:PREVIOUS_CONTAINER"
            docker rm -f ($previousId -join ' ')
          }
          docker run -d --name "$env:PREVIOUS_CONTAINER" -p 18000:8000 "$env:IMAGE"
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              if (Test-ServiceEndpoint 'http://127.0.0.1:18000/') { $healthy = $true; break }
            } catch { }
          }
          if ($false) {
            docker logs "$env:PREVIOUS_CONTAINER"
            docker rm -f "$env:PREVIOUS_CONTAINER"
            throw '새 이미지의 사전 헬스체크에 실패했습니다.'
          }
          if (-not $healthy) { throw 'Preflight health check failed for the new image.' }
          Write-Host 'Preflight health check passed.'
          docker stop "$env:PREVIOUS_CONTAINER"
          docker rm "$env:PREVIOUS_CONTAINER"
      - name: Replace running container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          [Console]::OutputEncoding = $OutputEncoding
          function Test-ServiceEndpoint([string]$Uri) {
            try {
              $request = [System.Net.WebRequest]::Create($Uri)
              $request.Timeout = 3000
              $response = $request.GetResponse()
              $status = [int]$response.StatusCode
              $response.Close()
              Write-Host "Health endpoint $Uri returned HTTP $status"
              return ($status -ge 200 -and $status -lt 400)
            } catch {
              Write-Host "Health endpoint $Uri error: $($_.Exception.Message)"
              return $false
            }
          }
          $oldId = docker container ls -aq --filter "name=^$env:CONTAINER_NAME`$"
          $oldExists = -not [string]::IsNullOrWhiteSpace(($oldId -join ''))
          if ($oldExists) {
            docker stop "$env:CONTAINER_NAME"
            docker rename "$env:CONTAINER_NAME" "$env:PREVIOUS_CONTAINER"
          }
          try {
            docker run -d --restart unless-stopped --name "$env:CONTAINER_NAME" -p "$($env:HOST_PORT):8000" "$env:IMAGE"
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                if (Test-ServiceEndpoint "http://127.0.0.1:$env:HOST_PORT/") { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Service health check failed after container replacement.' }
            if (-not $healthy) { throw '새 컨테이너 서비스 응답 검증에 실패했습니다.' }
            if ($oldExists) { docker rm "$env:PREVIOUS_CONTAINER" }
          } catch {
            $failedId = docker container ls -aq --filter "name=^$env:CONTAINER_NAME`$"
            if (-not [string]::IsNullOrWhiteSpace(($failedId -join ''))) {
              docker logs "$env:CONTAINER_NAME"
              docker rm -f "$env:CONTAINER_NAME"
            }
            if ($oldExists) {
              $rollbackId = docker container ls -aq --filter "name=^$env:PREVIOUS_CONTAINER`$"
              if (-not [string]::IsNullOrWhiteSpace(($rollbackId -join ''))) {
                docker rename "$env:PREVIOUS_CONTAINER" "$env:CONTAINER_NAME"
                docker start "$env:CONTAINER_NAME"
              }
            }
            throw
          }
