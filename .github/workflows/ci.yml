name: CI and Docker Hub

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on self-hosted Windows runner
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:${{ github.sha }}
      CONTAINER_NAME: local-timetable-planner
      PREVIOUS_CONTAINER: local-timetable-planner-previous
      HOST_PORT: '8000'
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull "$env:IMAGE"
      - name: Replace running container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $oldId = docker container ls -aq --filter "name=^$env:CONTAINER_NAME`$"
          $oldExists = -not [string]::IsNullOrWhiteSpace(($oldId -join ''))
          if ($oldExists) {
            docker stop "$env:CONTAINER_NAME"
            docker rename "$env:CONTAINER_NAME" "$env:PREVIOUS_CONTAINER"
          }
          try {
            docker run -d --restart unless-stopped --name "$env:CONTAINER_NAME" -p "$($env:HOST_PORT):8000" "$env:IMAGE"
            Start-Sleep -Seconds 5
            $newId = docker container ls -q --filter "name=^$env:CONTAINER_NAME`$" --filter "status=running"
            if ([string]::IsNullOrWhiteSpace(($newId -join ''))) {
              docker logs "$env:CONTAINER_NAME"
              throw 'New container is not running.'
            }
            Write-Host 'New container is running.'
            if ($oldExists) { docker rm "$env:PREVIOUS_CONTAINER" }
          } catch {
            $failedId = docker container ls -aq --filter "name=^$env:CONTAINER_NAME`$"
            if (-not [string]::IsNullOrWhiteSpace(($failedId -join ''))) { docker rm -f "$env:CONTAINER_NAME" }
            if ($oldExists) {
              $rollbackId = docker container ls -aq --filter "name=^$env:PREVIOUS_CONTAINER`$"
              if (-not [string]::IsNullOrWhiteSpace(($rollbackId -join ''))) {
                docker rename "$env:PREVIOUS_CONTAINER" "$env:CONTAINER_NAME"
                docker start "$env:CONTAINER_NAME"
                Write-Host 'Previous container was restored.'
              }
            }
            throw
          }
