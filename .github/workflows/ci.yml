name: CI, Docker Hub, and Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: local-timetable-planner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  monitor-before-change:
    name: Monitor current service before change
    needs: test
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      SERVICE_URL: http://127.0.0.1:8000/
    steps:
      - name: Monitor current deployment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\deployment-artifacts" | Out-Null
          $log = "$env:GITHUB_WORKSPACE\deployment-artifacts\monitor.log"
          $lines = @()
          $lines += "monitor_started=$(Get-Date -Format o)"
          $container = docker container ls --filter "name=^/local-timetable-planner`$" --format "{{.Names}}|{{.Status}}"
          $lines += "container=$container"
          if ([string]::IsNullOrWhiteSpace($container)) { $lines += 'result=FAIL container_not_running'; $lines | Set-Content -Encoding UTF8 $log; throw 'Current service container is not running.' }
          $success = 0; $failure = 0
          1..3 | ForEach-Object {
            $code = (& curl.exe -4 --noproxy "*" --silent --show-error --connect-timeout 3 --max-time 5 -o NUL -w "%{http_code}" $env:SERVICE_URL 2>&1 | Out-String).Trim()
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0 -and $code -match '^[23][0-9][0-9]$') { $success++ } else { $failure++ }
            $lines += "request=$_ http_code=$code curl_exit=$exitCode time=$(Get-Date -Format o)"
            Start-Sleep -Seconds 1
          }
          $lines += "result=$(if ($failure -eq 0) {'PASS'} else {'FAIL'}) success=$success failure=$failure"
          $lines | Set-Content -Encoding UTF8 $log
          if ($failure -gt 0) { throw 'Pre-change monitoring failed; deployment was not started.' }
      - name: Publish monitoring log and summary
        if: always()
        shell: powershell
        run: |
          $summary = "$env:GITHUB_STEP_SUMMARY"
          "## Pre-change monitoring`n`n- URL: http://127.0.0.1:8000/`n- Log: deployment-artifacts/monitor.log`n- Result: see monitor.log" | Out-File -FilePath $summary -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-monitor-${{ github.run_id }}
          path: deployment-artifacts
          if-no-files-found: warn

  docker:
    needs: monitor-before-change
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy and verify service
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/local-timetable-planner:${{ github.sha }}
      CONTAINER_NAME: local-timetable-planner
      PREVIOUS_CONTAINER: local-timetable-planner-previous
      SERVICE_URL: http://127.0.0.1:8000/
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull and replace container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\deployment-artifacts" | Out-Null
          $log = "$env:GITHUB_WORKSPACE\deployment-artifacts\deploy.log"
          $lines = @(); $lines += "deploy_started=$(Get-Date -Format o)"; $lines += "image=$env:IMAGE"
          docker pull "$env:IMAGE" 2>&1 | Tee-Object -FilePath $log -Append
          $oldId = docker container ls -aq --filter "name=^$env:CONTAINER_NAME`$"
          $oldExists = -not [string]::IsNullOrWhiteSpace(($oldId -join ''))
          if ($oldExists) { docker stop "$env:CONTAINER_NAME" 2>&1 | Tee-Object -FilePath $log -Append; docker rename "$env:CONTAINER_NAME" "$env:PREVIOUS_CONTAINER" }
          try {
            docker run -d --restart unless-stopped --name "$env:CONTAINER_NAME" -p "8000:8000" "$env:IMAGE" 2>&1 | Tee-Object -FilePath $log -Append
            Start-Sleep -Seconds 5
            $newId = docker container ls -q --filter "name=^$env:CONTAINER_NAME`$" --filter "status=running"
            if ([string]::IsNullOrWhiteSpace(($newId -join ''))) { docker logs "$env:CONTAINER_NAME" | Tee-Object -FilePath $log -Append; throw 'New container is not running.' }
            $lines += "container_after=$newId"; $lines += "version=$env:IMAGE"; $lines += "deploy_result=PASS"
            if ($oldExists) { docker rm "$env:PREVIOUS_CONTAINER" | Tee-Object -FilePath $log -Append }
          } catch {
            $lines += "deploy_result=FAIL error=$($_.Exception.Message)"
            $failedId = docker container ls -aq --filter "name=^$env:CONTAINER_NAME`$"
            if (-not [string]::IsNullOrWhiteSpace(($failedId -join ''))) { docker logs "$env:CONTAINER_NAME" | Tee-Object -FilePath $log -Append; docker rm -f "$env:CONTAINER_NAME" }
            if ($oldExists) { $rollbackId = docker container ls -aq --filter "name=^$env:PREVIOUS_CONTAINER`$"; if (-not [string]::IsNullOrWhiteSpace(($rollbackId -join ''))) { docker rename "$env:PREVIOUS_CONTAINER" "$env:CONTAINER_NAME"; docker start "$env:CONTAINER_NAME" } }
            throw
          } finally { $lines += "deploy_finished=$(Get-Date -Format o)"; $lines | Set-Content -Encoding UTF8 $log }
      - name: Verify deployed service and write summary
        if: always()
        shell: powershell
        run: |
          $log = "$env:GITHUB_WORKSPACE\deployment-artifacts\deploy.log"
          $success = 0; $failure = 0; $responses = @()
          1..3 | ForEach-Object { $code = (& curl.exe -4 --noproxy "*" --silent --show-error --connect-timeout 3 --max-time 5 -o NUL -w "%{http_code}" $env:SERVICE_URL 2>&1 | Out-String).Trim(); $exitCode = $LASTEXITCODE; if ($exitCode -eq 0 -and $code -match '^[23][0-9][0-9]$') { $success++ } else { $failure++ }; $responses += "request=$_ http_code=$code curl_exit=$exitCode time=$(Get-Date -Format o)" }
          $responses | Add-Content -Encoding UTF8 $log
          $status = if ($failure -eq 0) { 'PASS' } else { 'FAIL' }
          @("## Deployment verification", "", "- URL: $env:SERVICE_URL", "- Verification time: $(Get-Date -Format o)", "- Version: $env:IMAGE", "- Responses: $($responses -join '; ')", "- Request totals: success=$success, failure=$failure", "- Result: $status") | Out-File -FilePath "$env:GITHUB_STEP_SUMMARY" -Encoding utf8 -Append
          if ($failure -gt 0) { throw 'Post-deployment service verification failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-logs-${{ github.run_id }}
          path: deployment-artifacts
          if-no-files-found: warn
